; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
monitor_speed = 115200

[env:head]
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DBOARD_HAS_PSRAM
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<head/>
lib_deps =
    earlephilhower/ESP8266SAM
    earlephilhower/ESP8266Audio

[env:body]
board = esp32dev
framework = arduino
build_src_filter = -<*> +<body/>

[env:test_native]
platform = native
test_framework = googletest
test_filter = test_native*
lib_deps = 
    google/googletest @ ^1.14.0
build_flags = -std=c++17 -D NATIVE_ENV

[env:test_head]
extends = env:head
build_src_filter = +<head/> -<head/main.cpp>
test_filter = test_head*
board_upload.wait_for_upload_port = false
upload_speed = 115200
test_speed = 9600
monitor_rts = 0
monitor_dtr = 0
upload_flags = --before=no_reset
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
